License: Apache-2.0
AuthorName: mirarr-app
SourceCode: https://github.com/mirarr-app/memtickers
IssueTracker: https://github.com/mirarr-app/memtickers/issues
Changelog: https://github.com/mirarr-app/memtickers/releases

AutoUpdateMode: Version %v
UpdateCheckMode: Tags
CurrentVersion: 1.1.0
CurrentVersionCode: 2

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    build:
      - $$flutter$$/bin/flutter build apk --release

  - versionName: 1.1.0
