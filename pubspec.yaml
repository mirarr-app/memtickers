name: memtickers
description: Collect memories as vinyl stickers on an infinite scrapbook.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.2
  dynamic_color: ^1.8.1
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  image: ^4.5.4
  image_picker: ^1.2.0
  intl: ^0.20.2
  m3e_core: ^0.1.6
  native_exif: ^0.6.2
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  sensors_plus: ^6.1.2
  sqflite: ^2.4.2
  uuid: ^4.5.1
  flutter_m3shapes_extended: ^1.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/isnet-general-use-q8.onnx
